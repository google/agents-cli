      - CI/CD and production: guide/cicd.md
      - Observability:
        - Overview: guide/observability/index.md
        - Cloud Trace: guide/observability/cloud-trace.md
        - BigQuery Agent Analytics: guide/observability/bq-agent-analytics.md
  - Reference:
