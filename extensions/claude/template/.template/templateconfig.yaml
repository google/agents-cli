name: "claude"
description: "Claude Agent SDK agent (Claude on Gemini platform, A2A serving) — experimental; deploys to agent_runtime or cloud_run"
base_template: "empty_py"
example_question: "What's the weather in San Francisco?"
render_files: ["Dockerfile", ".env", "app/app_utils/settings.py"]
settings:
  language: "python"
  # agent_platform_sessions is ADK-only; the first entry is the default.
  requires_session: true
  session_types: ["in_memory", "cloud_sql"]
  deployment_targets: ["agent_runtime", "cloud_run", "none"]
  agent_directory: "app"
  extra_dependencies: []
  tags: ["claude", "a2a"]
  frontend_type: "None"
  # Accepts --memory-bank, which turns Memory Bank on in .env.
  supports_memory_bank: true
