]
lint = [
    { name = "codespell" },
    { name = "ruff" },
    { name = "ty" },
]

[package.dev-dependencies]
dev = [
    { name = "nest-asyncio" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
]

