# Read by the CLI when this template is fetched; never copied into the
# generated project, because the overlay skips .template/.
name: "langchain"
description: "LangChain agent (LangGraph graph, A2A serving) — experimental; cloud_run and gke are the supported targets"
# empty_py leaves out the ADK agent layer, so this template supplies its own
# agent, server and tests.
base_template: "empty_py"
example_question: "What's the weather in San Francisco?"
# Files that get the scaffold's values filled in, such as the agent name.
render_files: ["app/agent.py"]
settings:
  language: "python"
  # agent_platform_sessions is ADK-only; the first entry is the default.
  requires_session: true
  session_types: ["in_memory", "cloud_sql"]
  deployment_targets: ["agent_runtime", "cloud_run", "gke", "none"]
  agent_directory: "app"
  extra_dependencies: []
  tags: ["langchain", "a2a"]
  frontend_type: "None"
