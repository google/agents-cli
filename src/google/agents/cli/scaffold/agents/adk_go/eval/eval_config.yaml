metrics_to_run:
  - custom_response_quality

# Fail `agents-cli eval run` (exit 1) when a metric's mean score drops below
# its threshold. Set it once you know the bar this agent must meet.
# thresholds:
#   custom_response_quality: 4  # the judge scores 1-5

custom_metrics:
  # Default: local LLM-as-judge (see response_quality.py). Runs in-process via
  # google-genai on Gemini platform (ADC) or Google AI Studio (GEMINI_API_KEY).
  - name: custom_response_quality
    custom_function_file: response_quality.py
  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {'score': len(turns)}
