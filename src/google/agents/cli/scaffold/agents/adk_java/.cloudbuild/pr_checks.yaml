steps:
  # Build the project
  - name: "gradle:9.5.1-jdk17"
    id: build
    entrypoint: gradle
    args: ["assemble", "--no-daemon"]

  # Run unit tests
  - name: "gradle:9.5.1-jdk17"
    id: unit-tests
    entrypoint: gradle
    args: ["test", "--no-daemon", "--tests", "*.unit.*"]
    waitFor: ["build"]

  # Run integration tests
  - name: "gradle:9.5.1-jdk17"
    id: integration-tests
    entrypoint: gradle
    args: ["test", "--no-daemon", "--tests", "*.e2e.integration.*"]
    waitFor: ["unit-tests"]
    env:
      - "GOOGLE_CLOUD_PROJECT=${PROJECT_ID}"
      - "GOOGLE_CLOUD_LOCATION=global"
      - "GOOGLE_GENAI_USE_VERTEXAI=True"

logsBucket: gs://${PROJECT_ID}-{{cookiecutter.project_name}}-logs/build-logs
options:
  # /root/.gradle points into the image's ephemeral /home/gradle/.gradle volume.
  env:
    - "GRADLE_USER_HOME=/builder/home/.gradle"
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
