steps:
{%- if cookiecutter.deployment_target == 'cloud_run' or cookiecutter.deployment_target == 'gke' %}

  # Build and Push
  - name: "gcr.io/cloud-builders/docker"
    id: build-image
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        docker build \
          -t $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:$SHORT_SHA \
          .
        docker push $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:$SHORT_SHA
{%- endif %}
{%- if cookiecutter.deployment_target == 'cloud_run' %}

  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy-staging
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
        export PATH="$$HOME/.local/bin:$$PATH"
        {%- if cookiecutter.wheel_gcs_uri %}
        gsutil cp {{ cookiecutter.wheel_gcs_uri }} /tmp/
        uvx --from /tmp/{{ cookiecutter.wheel_gcs_uri.split('/')[-1] }} google-agents-cli deploy \
        {%- else %}
        uvx google-agents-cli{{ cookiecutter.agents_cli_version_pin }} deploy \
        {%- endif %}
          --project ${_STAGING_PROJECT_ID} \
          --region ${_REGION} \
          --image $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:$SHORT_SHA \
          --update-env-vars="OTEL_RESOURCE_ATTRIBUTES=service.version=$COMMIT_SHA"

  # Fetch Staging Service URL
  - name: "gcr.io/cloud-builders/gcloud"
    id: fetch-staging-url
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        echo $(gcloud run services describe {{cookiecutter.project_name}} \
        --region ${_REGION} --project ${_STAGING_PROJECT_ID} --format="value(status.url)") > staging_url.txt

  # Fetch ID Token
  - name: gcr.io/cloud-builders/gcloud
    id: fetch-id-token
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        echo $(gcloud auth print-identity-token -q) > id_token.txt
{%- elif cookiecutter.deployment_target == 'gke' %}

  # Deploy to Staging GKE
  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy-staging
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
        export PATH="$$HOME/.local/bin:$$PATH"
        {%- if cookiecutter.wheel_gcs_uri %}
        gsutil cp {{ cookiecutter.wheel_gcs_uri }} /tmp/
        uvx --from /tmp/{{ cookiecutter.wheel_gcs_uri.split('/')[-1] }} google-agents-cli deploy \
        {%- else %}
        uvx google-agents-cli{{ cookiecutter.agents_cli_version_pin }} deploy \
        {%- endif %}
          --project ${_STAGING_PROJECT_ID} \
          --region ${_REGION} \
          --cluster-name ${_GKE_CLUSTER_NAME} \
          --image $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:$SHORT_SHA \
          --update-env-vars="OTEL_RESOURCE_ATTRIBUTES=service.version=$COMMIT_SHA"

  # Get GKE credentials for port-forward
  - name: "gcr.io/cloud-builders/gcloud"
    id: get-gke-credentials
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        gcloud container clusters get-credentials ${_GKE_CLUSTER_NAME} --region ${_REGION} --project ${_STAGING_PROJECT_ID}
{%- elif cookiecutter.deployment_target == 'agent_runtime' %}
  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy-staging
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
        export PATH="$$HOME/.local/bin:$$PATH"
        {%- if cookiecutter.wheel_gcs_uri %}
        gsutil cp {{ cookiecutter.wheel_gcs_uri }} /tmp/
        uvx --from /tmp/{{ cookiecutter.wheel_gcs_uri.split('/')[-1] }} google-agents-cli deploy \
        {%- else %}
        uvx google-agents-cli{{ cookiecutter.agents_cli_version_pin }} deploy \
        {%- endif %}
          --project ${_STAGING_PROJECT_ID} \
          --region ${_REGION} \
{%- if not cookiecutter.agent_identity_enabled %}
          --service-account=${_APP_SERVICE_ACCOUNT_STAGING} \
{%- endif %}
          --update-env-vars="OTEL_RESOURCE_ATTRIBUTES=service.version=${COMMIT_SHA},LOGS_BUCKET_NAME=${_LOGS_BUCKET_NAME_STAGING}"


  - name: gcr.io/cloud-builders/gcloud
    id: fetch-auth-token
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        echo $(gcloud auth print-access-token -q) > auth_token.txt
{%- endif %}

  # Pre-fetch Go modules with retries so a dropped module proxy connection
  # doesn't fail the load test, which reuses them via GOMODCACHE in /workspace.
  - name: "golang:1.26"
    id: download-modules
    entrypoint: /bin/bash
    env:
      - "GOMODCACHE=/workspace/.gomodcache"
    args:
      - "-c"
      - |
        go mod download || (sleep 10 && go mod download) || (sleep 20 && go mod download)

{%- if cookiecutter.deployment_target == 'cloud_run' %}
  - name: "golang:1.26"
    id: load_test
    entrypoint: /bin/bash
    env:
      - "GOMODCACHE=/workspace/.gomodcache"
    args:
      - "-c"
      - |
        mkdir -p e2e/load_test/.results
        export _ID_TOKEN=$(cat id_token.txt)
        export _STAGING_URL=$(cat staging_url.txt)
        set -o pipefail
        go test -v -tags=load ./e2e/load_test/... \
          -staging-url=$$_STAGING_URL \
          -duration=30s -users=10 -ramp=0.5 2>&1 | tee e2e/load_test/.results/results.log
{%- elif cookiecutter.deployment_target == 'gke' %}
  - name: "gcr.io/cloud-builders/gcloud"
    id: load_test
    entrypoint: /bin/bash
    env:
      - "GOMODCACHE=/workspace/.gomodcache"
    args:
      - "-c"
      - |
        mkdir -p e2e/load_test/.results
        # Keep this at least the go directive in go.mod.
        curl -fsSL --retry 3 https://go.dev/dl/go1.26.10.linux-amd64.tar.gz | tar -C /usr/local -xz
        export PATH="$$PATH:/usr/local/go/bin"
        gcloud container clusters get-credentials ${_GKE_CLUSTER_NAME} --region ${_REGION} --project ${_STAGING_PROJECT_ID}
        kubectl port-forward svc/{{cookiecutter.project_name}} 8080:8080 -n {{cookiecutter.project_name}} &
        PF_PID=$$!
        sleep 5
        set -o pipefail
        go test -v -tags=load ./e2e/load_test/... \
          -staging-url=http://127.0.0.1:8080 \
          -duration=30s -users=10 -ramp=0.5 2>&1 | tee e2e/load_test/.results/results.log
        _LOAD_TEST_EXIT_CODE=$$?
        kill $$PF_PID || true
        exit $$_LOAD_TEST_EXIT_CODE
{%- elif cookiecutter.deployment_target == 'agent_runtime' %}
  - name: "golang:1.26"
    id: load_test
    entrypoint: /bin/bash
    env:
      - "GOMODCACHE=/workspace/.gomodcache"
    args:
      - "-c"
      - |
        mkdir -p e2e/load_test/.results
        export _AUTH_TOKEN=$(cat auth_token.txt)
        set -o pipefail
        go test -v -tags=load ./e2e/load_test/... \
          -duration=30s -users=2 -ramp=0.5 2>&1 | tee e2e/load_test/.results/results.log
{%- endif %}

  # Export Load Test Results to GCS
  - name: gcr.io/cloud-builders/gcloud
    id: export-results-to-gcs
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export _TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        gsutil -m cp -r e2e/load_test/.results gs://${_LOGS_BUCKET_NAME_STAGING}/load-test-results/results-$${_TIMESTAMP}
        echo "_________________________________________________________________________"
        echo "Load test results copied to gs://${_LOGS_BUCKET_NAME_STAGING}/load-test-results/results-$${_TIMESTAMP}"
        echo "HTTP link: https://console.cloud.google.com/storage/browser/${_LOGS_BUCKET_NAME_STAGING}/load-test-results/results-$${_TIMESTAMP}"
        echo "_________________________________________________________________________"

  # Trigger Prod Deployment
  - name: gcr.io/cloud-builders/gcloud
    id: trigger-prod-deployment
    entrypoint: gcloud
    args:
      - "beta"
      - "builds"
      - "triggers"
      - "run"
      - "deploy-{{cookiecutter.project_name}}"
      - "--region"
      - "$LOCATION"
      - "--project"
      - "$PROJECT_ID"
      - "--sha"
      - $COMMIT_SHA

  - name: gcr.io/cloud-builders/gcloud
    id: echo-view-build-trigger-link
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        echo "_________________________________________________________________________"
        echo "Production deployment triggered. View progress and / or approve on the Cloud Build Console:"
        echo "https://console.cloud.google.com/cloud-build/builds;region=$LOCATION"
        echo "_________________________________________________________________________"

substitutions:
  _STAGING_PROJECT_ID: YOUR_STAGING_PROJECT_ID
  _REGION: us-east1

logsBucket: gs://${PROJECT_ID}-{{ cookiecutter.project_name | replace('_', '-') }}-logs/build-logs
options:
  env:
    - 'UV_PYTHON=3.12'
    - 'CI=true'
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
