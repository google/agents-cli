steps:
  # Build and Push
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:$SHORT_SHA",
        "--build-arg",
        "COMMIT_SHA=$COMMIT_SHA",
        ".",
      ]
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:$SHORT_SHA",
      ]

{%- if cookiecutter.deployment_target == 'cloud_run' %}
  # Deploy to Staging
  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy-staging
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
        export PATH="$$HOME/.local/bin:$$PATH"
        {%- if cookiecutter.wheel_gcs_uri %}
        gsutil cp {{ cookiecutter.wheel_gcs_uri }} /tmp/
        uvx --from /tmp/{{ cookiecutter.wheel_gcs_uri.split('/')[-1] }} google-agents-cli deploy \
        {%- else %}
        uvx google-agents-cli{{ cookiecutter.agents_cli_version_pin }} deploy \
        {%- endif %}
          --project ${_STAGING_PROJECT_ID} \
          --region ${_REGION} \
          --image $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO_NAME/$_CONTAINER_NAME:$SHORT_SHA \
          --update-env-vars="OTEL_RESOURCE_ATTRIBUTES=service.version=$COMMIT_SHA"

  # Fetch Staging Service URL
  - name: "gcr.io/cloud-builders/gcloud"
    id: fetch-staging-url
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        echo $(gcloud run services describe {{cookiecutter.project_name}} \
        --region ${_REGION} --project ${_STAGING_PROJECT_ID} --format="value(status.url)") > staging_url.txt

  # Fetch ID Token
  - name: gcr.io/cloud-builders/gcloud
    id: fetch-id-token
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        echo $(gcloud auth print-identity-token -q) > id_token.txt

  # Load Testing
  - name: "gradle:9.5.1-jdk17"
    id: load_test
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export _ID_TOKEN=$(cat id_token.txt)
        export _STAGING_URL=$(cat staging_url.txt)
        gradle loadTest --no-daemon \
          -Pstaging.url=$$_STAGING_URL \
          -Pload.duration=30 \
          -Pload.users=10 \
          -Pload.ramp=2
{%- elif cookiecutter.deployment_target == 'gke' %}
  # Deploy to GKE Staging
  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy-staging
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        gcloud container clusters get-credentials ${_GKE_CLUSTER_NAME} --region ${_REGION} --project ${_STAGING_PROJECT_ID}
        kubectl set image deployment/{{cookiecutter.project_name}} \
          {{cookiecutter.project_name}}=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPO_NAME}/${_CONTAINER_NAME}:$SHORT_SHA -n {{cookiecutter.project_name}}
        EXTERNAL_IP=$$(kubectl get svc {{cookiecutter.project_name}} -n {{cookiecutter.project_name}} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        [ -n "$$EXTERNAL_IP" ] && kubectl set env deployment/{{cookiecutter.project_name}} APP_URL=http://$$EXTERNAL_IP:8080 -n {{cookiecutter.project_name}}
        kubectl rollout status deployment/{{cookiecutter.project_name}} -n {{cookiecutter.project_name}} --timeout=300s

  # Load Testing
  - name: "gcr.io/cloud-builders/gcloud"
    id: load_test
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        # The service's load balancer is internal, so the test reaches it through
        # a kubectl port-forward. This image has kubectl but no JDK 17 or Gradle.
        mkdir -p /opt/jdk
        curl -fsSL --retry 3 https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse | tar -C /opt/jdk -xz --strip-components=1
        curl -fsSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.5.1-bin.zip
        python3 -m zipfile -e /tmp/gradle.zip /opt
        chmod +x /opt/gradle-9.5.1/bin/gradle
        export JAVA_HOME=/opt/jdk PATH="/opt/gradle-9.5.1/bin:$$PATH"
        gcloud container clusters get-credentials ${_GKE_CLUSTER_NAME} --region ${_REGION} --project ${_STAGING_PROJECT_ID}
        kubectl port-forward svc/{{cookiecutter.project_name}} 8080:8080 -n {{cookiecutter.project_name}} &
        PF_PID=$$!
        sleep 5
        gradle loadTest --no-daemon \
          -Pstaging.url=http://127.0.0.1:8080 \
          -Pload.duration=30 \
          -Pload.users=10 \
          -Pload.ramp=2
        _LOAD_TEST_EXIT_CODE=$$?
        kill $$PF_PID || true
        exit $$_LOAD_TEST_EXIT_CODE
{%- endif %}

  # Trigger Prod Deployment
  - name: gcr.io/cloud-builders/gcloud
    id: trigger-prod-deployment
    entrypoint: gcloud
    args:
      - "beta"
      - "builds"
      - "triggers"
      - "run"
      - "deploy-{{cookiecutter.project_name}}"
      - "--region"
      - "$LOCATION"
      - "--project"
      - "$PROJECT_ID"
      - "--sha"
      - $COMMIT_SHA

  - name: gcr.io/cloud-builders/gcloud
    id: echo-view-build-trigger-link
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        echo "_________________________________________________________________________"
        echo "Production deployment triggered. View progress and / or approve on the Cloud Build Console:"
        echo "https://console.cloud.google.com/cloud-build/builds;region=$LOCATION"
        echo "_________________________________________________________________________"

substitutions:
  _STAGING_PROJECT_ID: YOUR_STAGING_PROJECT_ID
  _REGION: us-east1

logsBucket: gs://${PROJECT_ID}-{{cookiecutter.project_name}}-logs/build-logs
options:
  env:
    - 'UV_PYTHON=3.12'
    - 'CI=true'
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
