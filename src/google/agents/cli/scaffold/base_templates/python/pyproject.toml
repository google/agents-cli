[project]
name = "{{cookiecutter.project_name}}"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "your@email.com"},
]
{% set aiplatform_floor = "1.156.0" %}
{% set aiplatform_upper = "2.0.0" %}
dependencies = [
{%- for dep in cookiecutter.extra_dependencies %}
    "{{ dep }}",
{%- endfor %}
    "google-cloud-logging>=3.12.0,<4.0.0",
{%- if cookiecutter.deployment_target in ('cloud_run', 'gke') %}
    "google-cloud-aiplatform[evaluation]>={{ aiplatform_floor }},<{{ aiplatform_upper }}",
    "fastapi>=0.115.8,<1.0.0",
    "uvicorn~=0.34.0",
{#- TODO: b/542047689 - asyncpg/sqlalchemy are only used by cloud_sql sessions;
    move them to an extra that the Dockerfile installs. #}
    "asyncpg>=0.30.0,<1.0.0",
    "sqlalchemy[asyncio]>=2,<3",
    "python-multipart>=0.0.20,<1.0.0",
{%- elif cookiecutter.deployment_target == 'agent_runtime' %}
    "google-cloud-aiplatform[evaluation,agent-engines]>={{ aiplatform_floor }},<{{ aiplatform_upper }}",
    "protobuf>=6.31.1,<7.0.0",
{%- endif %}
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
{%- for dep in cookiecutter.extra_optional_dependencies.get('eval', []) %}
    "{{ dep }}",
{%- endfor %}
    "google-cloud-aiplatform[evaluation]>={{ aiplatform_floor }},<{{ aiplatform_upper }}"
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["{{cookiecutter.agent_directory}}", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["{{cookiecutter.agent_directory}}","frontend"]


